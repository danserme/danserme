<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Polina Bobrova, HCI Researcher and Design Engineer">
  <style>
    .name { font: 600 46px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #16141c; letter-spacing: -1px; }
    .role { font: 500 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #7c3aed; letter-spacing: 2px; }
    .line { font: 400 17px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #5f5b68; }
    .orb { animation: drift 9s ease-in-out infinite alternate; transform-origin: 760px 110px; }
    @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(-18px,10px) scale(1.08); } }
    @media (prefers-reduced-motion: reduce) { .orb { animation: none; } }
  </style>
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c"><rect width="900" height="220" rx="18"/></clipPath>
  </defs>
  <rect width="900" height="220" rx="18" fill="#f6f4f0"/>
  <g clip-path="url(#c)"><circle class="orb" cx="760" cy="110" r="150" fill="url(#g)"/></g>
  <text x="48" y="72" class="role">HCI RESEARCHER · DESIGN ENGINEER</text>
  <text x="46" y="128" class="name">Polina Bobrova</text>
  <text x="48" y="168" class="line">Speech AI, health wearables, and the research behind them. Milan.</text>
</svg>
