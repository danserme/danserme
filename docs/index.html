<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Murmuration · Polina Bobrova</title>
<meta name="description" content="A flock of dots you can steer, scatter, teach words to, and shout at.">
<style>
  :root {
    --bg: #f6f4f0; --fg: #16141c; --muted: #5f5b68; --faint: #dcd7e6; --panel: rgba(246,244,240,.82);
    --dot: #7c3aed; --hi: #16141c; --accent: #7c3aed; --on-accent: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0b0f; --fg: #f4f2ee; --muted: #9a97a3; --faint: #2a2733; --panel: rgba(11,11,15,.78);
      --dot: #a78bfa; --hi: #f4f2ee; --accent: #a78bfa; --on-accent: #0b0b0f;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
  body { font: 15px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }

  header { position: fixed; top: 0; left: 0; right: 0; padding: 20px 16px; display: flex; justify-content: space-between; gap: 12px; pointer-events: none; }
  header > * { pointer-events: auto; }
  .kicker { white-space: nowrap; font-size: 12px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
  .kicker b { color: var(--accent); font-weight: 500; }
  header a { color: var(--muted); font-size: 13px; text-decoration: none; }
  header a:hover { color: var(--fg); }

  .dock {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); width: min(640px, calc(100% - 32px));
    background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--faint); border-radius: 18px; padding: 12px;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  .dock form { display: flex; gap: 8px; flex: 1 1 260px; min-width: 0; }
  input, button {
    font: inherit; border-radius: 999px; border: 1px solid var(--faint); background: transparent; color: var(--fg);
    padding: 9px 16px; min-width: 0;
  }
  input { flex: 1; width: 1px; }
  input::placeholder { color: var(--muted); }
  button { cursor: pointer; white-space: nowrap; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips button { padding: 6px 12px; font-size: 13px; }
  @media (max-width: 480px) { .kicker span { display: none; } }
  .hint { width: 100%; font-size: 12px; color: var(--muted); padding: 2px 6px 0; }
</style>
</head>
<body>
<canvas id="c" aria-label="A flock of dots. Move to steer it, click to scatter it."></canvas>

<header>
  <div class="kicker mono"><b>murmuration</b><span> · Polina Bobrova</span></div>
  <a href="https://github.com/danserme">← back to GitHub</a>
</header>

<div class="dock">
  <form id="f">
    <input id="word" maxlength="12" placeholder="Type a word…" autocomplete="off" aria-label="Word for the flock to spell">
    <button class="primary">Spell</button>
  </form>
  <div class="chips">
    <button data-w="ciao">ciao</button>
    <button data-w="murmur">murmur</button>
    <button data-w="vera">vera</button>
    <button id="mic" aria-pressed="false" title="The flock flinches when you make noise. Audio never leaves your device.">🎤 shout at it</button>
  </div>
  <div class="hint" id="hint">Move to steer · click or tap to scatter · type a word</div>
</div>

<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const hint = document.getElementById('hint');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, dpr;
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  let colDot, colHi;
  const readColors = () => { colDot = css('--dot'); colHi = css('--hi'); };
  readColors(); matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors);

  const N = Math.round(Math.min(520, Math.max(220, innerWidth * innerHeight / 2600)));
  const px = new Float32Array(N), py = new Float32Array(N), vx = new Float32Array(N), vy = new Float32Array(N);
  const tx = new Float32Array(N), ty = new Float32Array(N), r = new Float32Array(N), hi = new Uint8Array(N), op = new Float32Array(N);

  function resize() {
    dpr = devicePixelRatio || 1; W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize); resize();

  for (let i = 0; i < N; i++) {
    px[i] = W / 2 + (Math.random() - .5) * 200; py[i] = H / 2 + (Math.random() - .5) * 120;
    const a = Math.random() * 6.28; vx[i] = Math.cos(a) * 80; vy[i] = Math.sin(a) * 80;
    r[i] = [1.6, 2, 2.4, 2.8][Math.floor(Math.random() ** 1.6 * 4)];
    hi[i] = Math.random() < .07; op[i] = .55 + Math.random() * .45;
  }

  // ---- input state
  let pointer = null, pointerSeen = 0, spelling = false, spellUntil = 0, noise = 0;
  const bursts = [];
  let touched = false;
  cv.addEventListener('pointermove', e => {
    // browsers fire synthetic moves (often at 0,0) on load; only follow real movement
    if (e.pointerType === 'mouse' && !e.movementX && !e.movementY) return;
    pointer = { x: e.clientX, y: e.clientY }; pointerSeen = performance.now();
  });
  cv.addEventListener('pointerleave', () => { pointer = null; });
  cv.addEventListener('pointerdown', e => {
    touched = true;
    bursts.push({ x: e.clientX, y: e.clientY, t: performance.now() });
    if (spelling) release();
  });

  // ---- spelling: rasterise the word, sample dots evenly, match by x to avoid crossings
  const off = document.createElement('canvas'), octx = off.getContext('2d', { willReadFrequently: true });
  function spell(word) {
    word = word.trim().slice(0, 12); if (!word) return;
    const maxW = Math.min(W - 48, 1100);
    let size = Math.min(H * .32, 260);
    octx.font = `800 ${size}px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif`;
    const mw = octx.measureText(word).width;
    if (mw > maxW) size *= maxW / mw;
    off.width = W; off.height = H;
    octx.font = `800 ${size}px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif`;
    octx.textAlign = 'center'; octx.textBaseline = 'middle'; octx.fillStyle = '#000';
    octx.fillText(word, W / 2, H * .44);
    const data = octx.getImageData(0, 0, W, H).data;
    // pick a grid step that yields roughly N points
    let pts = [];
    for (let step = Math.max(3, Math.round(size / 22)); step >= 2; step--) {
      pts = [];
      for (let y = 0; y < H; y += step) for (let x = 0; x < W; x += step) if (data[(y * W + x) * 4 + 3] > 128) pts.push([x + (Math.random() - .5) * step * 1.4, y + (Math.random() - .5) * step * 1.4]);
      if (pts.length >= N * .8) break;
    }
    if (!pts.length) return;
    while (pts.length < N) pts.push(pts[Math.floor(Math.random() * pts.length)]);
    pts.sort(() => Math.random() - .5); pts = pts.slice(0, N).sort((a, b) => a[0] - b[0]);
    const idx = [...Array(N).keys()].sort((a, b) => px[a] - px[b]);
    idx.forEach((k, j) => { tx[k] = pts[j][0]; ty[k] = pts[j][1]; });
    spelling = true; spellUntil = performance.now() + 4500;
    hint.textContent = 'Click anywhere to let it go';
  }
  function release() { spelling = false; hint.textContent = 'Move to steer · click or tap to scatter · type a word'; }

  document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); touched = true; const w = document.getElementById('word'); spell(w.value); w.blur(); });
  document.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { touched = true; spell(b.dataset.w); });

  // ---- microphone: loudness only, computed locally
  let analyser, buf, stream;
  document.getElementById('mic').onclick = async function () {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = analyser = null; this.setAttribute('aria-pressed', 'false'); return; }
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      analyser = ac.createAnalyser(); analyser.fftSize = 512; buf = new Uint8Array(analyser.fftSize);
      ac.createMediaStreamSource(stream).connect(analyser);
      this.setAttribute('aria-pressed', 'true'); hint.textContent = 'Make some noise. Nothing is recorded or sent anywhere.';
    } catch (_) { hint.textContent = 'No microphone access, but clicking still scares them.'; }
  };
  function loudness() {
    if (!analyser) return 0;
    analyser.getByteTimeDomainData(buf);
    let s = 0; for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; s += v * v; }
    return Math.min(1, Math.sqrt(s / buf.length) * 6);
  }

  // ---- simulation (uniform grid for neighbour lookups)
  const CELL = 60, NR = 60, SEP = 10;
  let grid = new Map();
  function rebuild() {
    grid.clear();
    for (let i = 0; i < N; i++) {
      const k = ((px[i] / CELL) | 0) * 4096 + ((py[i] / CELL) | 0);
      let a = grid.get(k); if (!a) grid.set(k, a = []); a.push(i);
    }
  }

  let last = performance.now(), t0 = last;
  function step(now) {
    const dt = Math.min(.033, (now - last) / 1000); last = now;
    const t = (now - t0) / 1000;
    if (spelling && now > spellUntil && !document.activeElement.matches('input')) release();
    noise += (loudness() - noise) * .3;

    const idle = !pointer || now - pointerSeen > 2500;
    const ax = idle ? W / 2 + W * .33 * Math.sin(t * .45) : pointer.x;
    const ay = idle ? H * .45 + H * .18 * Math.sin(t * .9 + 1) : pointer.y;
    const maxS = (200 + noise * 500) * (reduce ? .45 : 1), minS = reduce ? 30 : 70;

    rebuild();
    for (let i = 0; i < N; i++) {
      let fx = 0, fy = 0;
      if (spelling) {
        fx = (tx[i] - px[i]) * 9 - vx[i] * 4.5; fy = (ty[i] - py[i]) * 9 - vy[i] * 4.5;
      } else {
        let cx = 0, cy = 0, al = 0, ay2 = 0, sx = 0, sy = 0, n = 0;
        const gx = (px[i] / CELL) | 0, gy = (py[i] / CELL) | 0;
        for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++) {
          const a = grid.get((gx + ox) * 4096 + gy + oy); if (!a) continue;
          for (const j of a) {
            if (j === i) continue;
            const dx = px[j] - px[i], dy = py[j] - py[i], d2 = dx * dx + dy * dy;
            if (d2 > NR * NR) continue;
            cx += dx; cy += dy; al += vx[j]; ay2 += vy[j]; n++;
            if (d2 < SEP * SEP) { const d = Math.sqrt(d2) + .01; sx -= dx / (d * d) * 60; sy -= dy / (d * d) * 60; }
          }
        }
        if (n) { fx += cx / n * 1.2 + (al / n - vx[i]) * .35; fy += cy / n * 1.2 + (ay2 / n - vy[i]) * .35; }
        fx += sx + (ax - px[i]) * .5; fy += sy + (ay - py[i]) * .5;
        // soft walls
        const m = 30;
        if (px[i] < m) fx += (m - px[i]) * 25; if (px[i] > W - m) fx -= (px[i] - W + m) * 25;
        if (py[i] < m) fy += (m - py[i]) * 25; if (py[i] > H - m) fy -= (py[i] - H + m) * 25;
        // noise makes them flinch outward from the flock centre
        if (noise > .08) { fx += (px[i] - ax) * noise * 6 + (Math.random() - .5) * noise * 800; fy += (py[i] - ay) * noise * 6 + (Math.random() - .5) * noise * 800; }
      }
      // click bursts push everyone away for ~0.6s
      for (const b of bursts) {
        const age = (now - b.t) / 1000; if (age > .6) continue;
        const dx = px[i] - b.x, dy = py[i] - b.y, d = Math.hypot(dx, dy) + 1;
        if (d < 260) { const k = (1 - d / 260) * (1 - age / .6) * 9000; fx += dx / d * k; fy += dy / d * k; }
      }
      vx[i] += fx * dt; vy[i] += fy * dt;
      if (!spelling) {
        const s = Math.hypot(vx[i], vy[i]) || 1, c = Math.min(maxS, Math.max(minS, s)) / s;
        vx[i] *= c; vy[i] *= c;
      }
      px[i] += vx[i] * dt; py[i] += vy[i] * dt;
    }
    while (bursts.length && now - bursts[0].t > 600) bursts.shift();

    ctx.clearRect(0, 0, W, H);
    for (let pass = 0; pass < 2; pass++) {
      ctx.fillStyle = pass ? colHi : colDot;
      for (let i = 0; i < N; i++) {
        if (hi[i] !== pass) continue;
        ctx.globalAlpha = pass ? .95 : op[i];
        ctx.beginPath(); ctx.arc(px[i], py[i], r[i], 0, 6.283); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);

  if (reduce) hint.textContent = 'Reduced motion is on, so the flock moves gently. Click to scatter, type to spell.';
  setTimeout(() => { if (!spelling && !touched) spell('ciao'); }, 1400);
})();
</script>
</body>
</html>
